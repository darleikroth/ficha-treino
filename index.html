<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + env(safe-area-inset-*) no CSS: sem isso os botões de
         registrar série ficam sob a barra de gestos do iPhone (ARQUITETURA §14). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- O iOS ignora o manifest: sem esta tag não há ícone na tela de início,
         e o Safari usa um screenshot genérico da página (DD-A15). -->
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="FichaTreino" />
    <title>FichaTreino</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
